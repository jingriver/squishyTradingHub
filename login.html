<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register or Log In - Squishy + Trinkets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: var(--soft);
      padding: 24px;
    }
    .auth-shell {
      background: var(--card);
      border-radius: 24px;
      padding: 40px;
      width: min(560px, 100%);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      display: grid;
      gap: 20px;
    }
    .brand {
      justify-content: center;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand p {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      margin: 0;
    }
    .brand h1 {
      font-family: "DM Serif Display", serif;
      font-size: 22px;
      margin: 0;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
    }
    .auth-header {
      text-align: center;
      display: grid;
      gap: 10px;
    }
    .auth-header h2 {
      font-family: "DM Serif Display", serif;
      font-size: 34px;
      margin: 0;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--soft);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }
    .auth-tab {
      border: none;
      border-radius: 999px;
      background: transparent;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-tab.active {
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .auth-panel {
      display: none;
      gap: 14px;
    }
    .auth-panel.active {
      display: grid;
    }
    .auth-panel label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .auth-panel input {
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 12px 14px;
      background: #fff;
      font-size: 14px;
    }
    .auth-submit,
    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-submit {
      border: none;
      background: var(--accent);
      color: #fff;
    }
    .google-btn {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .auth-divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      height: 1px;
      background: var(--line);
    }
    .auth-message {
      min-height: 20px;
      font-size: 13px;
      text-align: center;
    }
    .auth-message.error {
      color: #c0392b;
    }
    .auth-message.success {
      color: #1e874b;
    }
    .back-link {
      display: inline-block;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover {
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <p>Squishy + Trinkets</p>
        <h1>Trading Hub</h1>
      </div>
    </div>

    <div class="auth-header">
      <h2>Join the Hub</h2>
      <p class="muted">Register with email and password, or continue with Google.</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" type="button" data-panel="register">Register</button>
      <button class="auth-tab" type="button" data-panel="login">Log In</button>
    </div>

    <div class="auth-panel active" id="registerPanel">
      <label>
        Display name
        <input type="text" id="registerName" placeholder="minty.muse" />
      </label>
      <label>
        Email
        <input type="email" id="registerEmail" placeholder="you@example.com" />
      </label>
      <label>
        Password
        <input type="password" id="registerPassword" placeholder="At least 8 characters" />
      </label>
      <button class="auth-submit" id="registerSubmit" type="button">Create Account</button>
    </div>

    <div class="auth-panel" id="loginPanel">
      <label>
        Email
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </label>
      <label>
        Password
        <input type="password" id="loginPassword" placeholder="Your password" />
      </label>
      <button class="auth-submit" id="loginSubmit" type="button">Log In</button>
    </div>

    <div class="auth-divider">or</div>

    <a href="/auth/google" class="google-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.16v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.16C1.43 8.55 1 10.22 1 12s.43 3.45 1.16 4.93l3.68-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.16 7.07l3.68 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>

    <div class="auth-message" id="authMessage"></div>
    <a href="/" class="back-link">Back to Hub</a>
  </div>

  <script>
    const tabs = document.querySelectorAll('.auth-tab');
    const panels = {
      register: document.getElementById('registerPanel'),
      login: document.getElementById('loginPanel'),
    };
    const message = document.getElementById('authMessage');

    function setPanel(name) {
      tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.panel === name));
      Object.entries(panels).forEach(([key, panel]) => {
        panel.classList.toggle('active', key === name);
      });
      message.textContent = '';
      message.className = 'auth-message';
    }

    async function submitJson(path, payload, button) {
      const original = button.textContent;
      button.disabled = true;
      button.textContent = 'Working...';
      message.textContent = '';
      message.className = 'auth-message';
      try {
        const response = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json') ? await response.json() : { error: await response.text() };
        if (!response.ok) {
          throw new Error(data.error || 'Request failed');
        }
        message.textContent = data.message || 'Success.';
        message.className = 'auth-message success';
        window.location.href = '/';
      } catch (err) {
        message.textContent = err.message || 'Unable to complete request.';
        message.className = 'auth-message error';
      } finally {
        button.disabled = false;
        button.textContent = original;
      }
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => setPanel(tab.dataset.panel));
    });

    document.getElementById('registerSubmit').addEventListener('click', () => {
      submitJson('/auth/register', {
        name: document.getElementById('registerName').value.trim(),
        email: document.getElementById('registerEmail').value.trim(),
        password: document.getElementById('registerPassword').value,
      }, document.getElementById('registerSubmit'));
    });

    document.getElementById('loginSubmit').addEventListener('click', () => {
      submitJson('/auth/login', {
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginPassword').value,
      }, document.getElementById('loginSubmit'));
    });
  </script>
</body>
</html>
